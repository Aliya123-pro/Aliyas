name: Test Account Login (Docker)

on:
  workflow_dispatch:
    inputs:
      email:
        description: "Adresse email du compte"
        required: true
        type: string
      password:
        description: "Mot de passe du compte"
        required: true
        type: string
      platform:
        description: "Plateforme (ex: tronpick)"
        required: true
        type: string
      proxyIndex:
        description: "Index du proxy (0 par défaut)"
        required: false
        type: string
        default: "0"
      initialTimer:
        description: "Timer initial (format mm:ss)"
        required: false
        type: string
        default: "60:00"
      action:
        description: "Action (login)"
        required: false
        type: string
        default: "login"
      userId:
        description: "Identifiant utilisateur (optionnel)"
        required: false
        type: string

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container:
      image: ghcr.io/aliya123-pro/camoufox-system:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Exécuter le script de login
        working-directory: /app
        env:
          HOME: /home/camoxuser
          DISPLAY: ":99"
          TEST_EMAIL: ${{ github.event.inputs.email }}
          TEST_PASSWORD: ${{ github.event.inputs.password }}
          TEST_PLATFORM: ${{ github.event.inputs.platform }}
          TEST_PROXY_INDEX: ${{ github.event.inputs.proxyIndex }}
          TEST_INITIAL_TIMER: ${{ github.event.inputs.initialTimer }}
          TEST_ACTION: ${{ github.event.inputs.action }}
          USER_ID: ${{ github.event.inputs.userId }}
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_BRANCH: ${{ secrets.GH_BRANCH || 'main' }}
          JP_PROXY_LIST: ${{ secrets.JP_PROXY_LIST }}
          CRYPTO_SECRET: ${{ secrets.CRYPTO_SECRET }}
        run: xvfb-run --auto-servernum python test_login_workflow.py

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: login-video-${{ github.run_id }}
          path: /app/videos/*.mp4
          if-no-files-found: warn
